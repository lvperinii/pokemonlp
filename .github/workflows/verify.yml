name: Verificar dados (auditoria)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auditar targets.json contra a TCGdex
        run: node scripts/verify.mjs
