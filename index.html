<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c1f26">
  <title>Coleção Megaevolução — o que falta</title>
  <link rel="icon" href="./assets/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./assets/icon.svg" alt="" width="28" height="28">
      <span>Coleção <em id="block-name">Megaevolução</em></span>
    </div>
    <div class="actions">
      <button id="btn-export" class="btn ghost" title="Baixar backup da sua coleção">Exportar</button>
      <button id="btn-import" class="btn ghost" title="Restaurar backup">Importar</button>
      <input id="file-import" type="file" accept="application/json" hidden>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><span class="num" id="stat-total">0</span><span class="lbl">Na seleção</span></div>
    <div class="stat ok"><span class="num" id="stat-owned">0</span><span class="lbl">Tenho</span></div>
    <div class="stat miss"><span class="num" id="stat-missing">0</span><span class="lbl">Faltam</span></div>
    <div class="stat"><span class="num" id="stat-pct">0%</span><span class="lbl">Completo</span></div>
  </section>

  <section class="filters">
    <input id="f-q" type="search" placeholder="Buscar por nome ou número…">
    <select id="f-set"><option value="">Todos os sets</option></select>
    <select id="f-code">
      <option value="">Todas raridades</option>
      <option value="UR">UR — Ultra Rara</option>
      <option value="IR">IR — Ilustração Rara</option>
      <option value="SIR">SIR — Ilustração Rara Especial</option>
      <option value="MHR">MHR — Mega Hiper Raro</option>
    </select>
    <select id="f-reason">
      <option value="">Todas as regras</option>
      <option value="rarity">Raridade-chase</option>
      <option value="megaEvo">Cartas Mega</option>
      <option value="named">Pikachu/Starter</option>
    </select>
    <div class="segmented">
      <button class="f-status" data-status="missing">Faltam</button>
      <button class="f-status" data-status="owned">Tenho</button>
      <button class="f-status" data-status="all">Todos</button>
    </div>
  </section>

  <main id="content" class="content">
    <div class="empty"><h3>Carregando…</h3></div>
  </main>

  <!-- Modal: Carta -->
  <div id="modal-card" class="modal">
    <div class="modal-box">
      <div class="modal-head"><h2>Carta</h2><button class="x" data-close="#modal-card">×</button></div>
      <div id="card-modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
